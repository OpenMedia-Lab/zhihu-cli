[package]
name = "zhihu"
version = "0.1.0"
edition = "2021"
description = "A lightweight Zhihu CLI — browse, read, and post drafts from the terminal"
license = "MIT"
repository = "https://github.com/OpenMedia-Lab/zhihu-cli"

[features]
default = ["browser-cookies"]
browser-cookies = ["dep:rookie"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
qrcode = "0.14"
md5 = "0.7"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
httpdate = "1"
imagesize = "0.13"
uuid = { version = "1", features = ["v4"] }
rookie = { version = "0.5", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
